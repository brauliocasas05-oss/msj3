<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mensajería MX</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6757d9">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
body{background:#eef0f6;color:#202330;overflow:hidden}
button,input,textarea{font:inherit}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#6757d9,#4b8bf5);z-index:50}
.card{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:28px;box-shadow:0 15px 40px #0003;text-align:center}
.logo{width:66px;height:66px;border-radius:18px;background:#6757d9;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px}
.card h1{margin:0 0 8px}.card p{color:#666;font-size:14px;line-height:1.4}
#nombre{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;text-align:center;outline:0;margin:8px 0}
#nombre:focus{border-color:#6757d9}
#entrar{width:100%;padding:14px;border:0;border-radius:10px;background:#6757d9;color:white;font-weight:bold;cursor:pointer}
#entrar:disabled{opacity:.6}
#estado{min-height:20px;margin-top:10px;font-size:13px;color:#c00}
#app{height:100%;display:none;flex-direction:column}
header{height:66px;flex:0 0 66px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.user{display:flex;align-items:center;gap:9px;min-width:0}.mini{width:40px;height:40px;border-radius:12px;background:#6757d9;color:#fff;display:flex;align-items:center;justify-content:center}
#nombreActivo{font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#conexion{font-size:11px;color:#269447;margin-top:2px}
#cambiar{padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#f7f7fa;font-size:11px;font-weight:bold}
#chat{flex:1;min-height:0;display:flex;flex-direction:column}
#mensajes{flex:1;overflow-y:auto;padding:12px;background:#f3f4f8}
.vacio{text-align:center;color:#888;margin-top:45px;font-size:14px}
.fila{display:flex;margin:0 0 8px}.fila.mio{justify-content:flex-end}.fila.otro{justify-content:flex-start}
.burbuja{max-width:82%;padding:9px 11px;border-radius:15px;overflow-wrap:anywhere;box-shadow:0 2px 6px #0000000d}
.mio .burbuja{background:#6757d9;color:#fff;border-bottom-right-radius:4px}.otro .burbuja{background:#fff;border-bottom-left-radius:4px}
.remitente{font-size:10px;font-weight:bold;opacity:.75;margin-bottom:3px}.cuerpo{font-size:15px;white-space:pre-wrap;line-height:1.35}.hora{font-size:9px;opacity:.6;text-align:right;margin-top:4px}
#escribir{background:#fff;border-top:1px solid #ddd;padding:9px;display:flex;gap:8px;padding-bottom:max(9px,env(safe-area-inset-bottom))}
#texto{flex:1;min-width:0;resize:none;max-height:120px;border:2px solid #ddd;border-radius:16px;padding:10px 12px;outline:0}
#texto:focus{border-color:#6757d9}#enviar{width:48px;height:48px;border:0;border-radius:50%;background:#6757d9;color:#fff;font-size:20px}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo">💬</div>
    <h1>Mensajería MX</h1>
    <p>Escribe tu nombre y entra. No necesitas correo ni contraseña.</p>
    <input id="nombre" maxlength="20" autocomplete="off" placeholder="Ej. Braulio">
    <button id="entrar">ENTRAR AL CHAT</button>
    <div id="estado"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="user">
      <div class="mini">💬</div>
      <div>
        <div id="nombreActivo">Usuario</div>
        <div id="conexion">● Conectando...</div>
      </div>
    </div>
    <button id="cambiar">CAMBIAR</button>
  </header>

  <section id="chat">
    <div id="mensajes"><div class="vacio">Cargando mensajes...</div></div>
    <form id="escribir">
      <textarea id="texto" rows="1" maxlength="1000" placeholder="Escribe un mensaje..."></textarea>
      <button id="enviar" type="submit">➤</button>
    </form>
  </section>
</div>

<script>
const SUPABASE_URL="https://anrdwzwtjnmjqmpbxzxa.supabase.co";
const SUPABASE_KEY="sb_publishable_Nshraofg9n-Tc6zl8Resxw_vVnVPyct";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const login=document.getElementById("login");
const app=document.getElementById("app");
const nombre=document.getElementById("nombre");
const entrar=document.getElementById("entrar");
const estado=document.getElementById("estado");
const nombreActivo=document.getElementById("nombreActivo");
const conexion=document.getElementById("conexion");
const mensajes=document.getElementById("mensajes");
const texto=document.getElementById("texto");
const enviar=document.getElementById("enviar");
let user=null;
let perfil=null;
let channel=null;

function err(msg){estado.textContent=msg;estado.style.color="#c00"}
function ok(msg){estado.textContent=msg;estado.style.color="#198754"}
function clean(s){return s.trim().replace(/\s+/g,"_").replace(/[^a-zA-Z0-9_-]/g,"")}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function time(s){return new Date(s).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}
function bottom(){requestAnimationFrame(()=>mensajes.scrollTop=mensajes.scrollHeight)}

async function entrarChat(){
  const n=clean(nombre.value);
  if(n.length<2){err("Escribe al menos 2 caracteres.");return}
  entrar.disabled=true; estado.textContent="Conectando..."; estado.style.color="#555";

  try{
    const {data:sd,error:se}=await client.auth.getSession();
    if(se) throw se;

    if(sd.session?.user?.is_anonymous){
      user=sd.session.user;
    }else{
      if(sd.session) await client.auth.signOut({scope:"local"});
      const {data,error}=await client.auth.signInAnonymously({
        options:{data:{username:n}}
      });
      if(error) throw error;
      user=data.user;
    }

    const {data:p,error:pe}=await client
      .from("chat_profiles")
      .select("user_id,username")
      .eq("user_id",user.id)
      .maybeSingle();

    if(pe) throw pe;

    if(!p){
      const {data:created,error:ce}=await client
        .from("chat_profiles")
        .insert({user_id:user.id,username:n})
        .select("user_id,username")
        .single();
      if(ce) throw ce;
      perfil=created;
    }else{
      if(p.username.toLowerCase()!==n.toLowerCase()){
        const {data:renamed,error:re}=await client
          .from("chat_profiles")
          .update({username:n})
          .eq("user_id",user.id)
          .select("user_id,username")
          .single();
        if(re) throw re;
        perfil=renamed;
      }else perfil=p;
    }

    localStorage.setItem("mensajeria_nombre",perfil.username);
    nombreActivo.textContent="👤 "+perfil.username;
    login.style.display="none";
    app.style.display="flex";
    conexion.textContent="● Conectado";
    conexion.style.color="#198754";

    await cargarMensajes();
    iniciarRealtime();
    texto.focus();

  }catch(e){
    console.error(e);
    err("ERROR: "+(e?.message||"No se pudo entrar"));
  }finally{
    entrar.disabled=false;
  }
}

async function cargarMensajes(){
  mensajes.innerHTML='<div class="vacio">Cargando mensajes...</div>';
  const {data,error}=await client.from("chat_messages")
    .select("id,user_id,username,body,created_at")
    .order("created_at",{ascending:true})
    .limit(200);

  if(error){
    mensajes.innerHTML='<div class="vacio">Error cargando mensajes.<br>'+esc(error.message)+'</div>';
    return;
  }
  mensajes.innerHTML="";
  if(!data?.length){
    mensajes.innerHTML='<div class="vacio">Todavía no hay mensajes.<br>Sé el primero en escribir.</div>';
    return;
  }
  data.forEach(addMessage);
  bottom();
}

function addMessage(m){
  if(document.querySelector('[data-id="'+m.id+'"]')) return;
  const row=document.createElement("div");
  const mine=m.user_id===user?.id;
  row.className="fila "+(mine?"mio":"otro");
  row.dataset.id=m.id;
  row.innerHTML='<div class="burbuja">'+
    (mine?"":'<div class="remitente">'+esc(m.username)+'</div>')+
    '<div class="cuerpo">'+esc(m.body)+'</div>'+
    '<div class="hora">'+time(m.created_at)+'</div>'+
    '</div>';
  const empty=mensajes.querySelector(".vacio");
  if(empty) empty.remove();
  mensajes.appendChild(row);
  bottom();
}

async function enviarMensaje(){
  const body=texto.value.trim();
  if(!body||!user) return;
  enviar.disabled=true;
  const {data,error}=await client.from("chat_messages").insert({
    user_id:user.id,
    username:perfil.username,
    body:body
  }).select("id,user_id,username,body,created_at").single();
  enviar.disabled=false;
  if(error){
    console.error(error);
    conexion.textContent="● Error al enviar";
    conexion.style.color="#c00";
    return;
  }
  if(data) addMessage(data);
  texto.value="";
  texto.style.height="auto";
  texto.focus();
}

function iniciarRealtime(){
  if(channel) client.removeChannel(channel);
  channel=client.channel("chat-general")
    .on("postgres_changes",
      {event:"INSERT",schema:"public",table:"chat_messages"},
      payload=>addMessage(payload.new)
    )
    .subscribe(status=>{
      if(status==="SUBSCRIBED"){
        conexion.textContent="● En línea";
        conexion.style.color="#198754";
      }
    });
}

entrar.addEventListener("click",entrarChat);
nombre.addEventListener("keydown",e=>{if(e.key==="Enter") entrarChat()});
document.getElementById("escribir").addEventListener("submit",e=>{e.preventDefault();enviarMensaje()});
texto.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviarMensaje()}
});
texto.addEventListener("input",()=>{
  texto.style.height="auto";
  texto.style.height=Math.min(texto.scrollHeight,120)+"px";
});
document.getElementById("cambiar").addEventListener("click",async()=>{
  if(channel){await client.removeChannel(channel);channel=null}
  await client.auth.signOut({scope:"local"});
  user=null;perfil=null;app.style.display="none";login.style.display="flex";
  nombre.value="";estado.textContent="";nombre.focus();
});

const saved=localStorage.getItem("mensajeria_nombre");
if(saved) nombre.value=saved;

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(console.error);
  });
}
</script>
</body>
</html>
